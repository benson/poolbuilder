name: Generate Daily Challenge

on:
  schedule:
    # Run after homepage publishes MTGJSON-derived shared artifacts.
    - cron: '40 10 * * *'
  workflow_dispatch:

concurrency:
  group: poolbuilder-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: node scripts/test-17lands.js && node scripts/test-daily.js && node scripts/test-worker.js

      - name: Generate daily expert ghost
        env:
          POOLBUILDER_ADMIN_SECRET: ${{ secrets.POOLBUILDER_ADMIN_SECRET }}
          POOLBUILDER_API_URL: https://poolbuilder-api.bensonperry.workers.dev
        run: node scripts/generate-daily.js --require-worker

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily.json
          git diff --staged --quiet || git commit -m "daily challenge $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
