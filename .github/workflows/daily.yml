name: Generate Daily Challenge

on:
  schedule:
    # Keep this away from Pack Cracker's cache refresh and other Scryfall-backed jobs.
    - cron: '40 10 * * *'
  workflow_dispatch:

concurrency:
  group: poolbuilder-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download shared modules
        run: curl -s https://bensonperry.com/shared/mtg.js -o scripts/mtg.js

      - name: Run tests
        run: node scripts/test-daily.js

      - name: Generate daily pool
        run: node scripts/generate-daily.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily.json
          git diff --staged --quiet || git commit -m "daily challenge $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
